<!DOCTYPE html>
{# productos/templates/base.html #}
{# Plantilla "madre": define el esqueleto HTML común (head, estilos, #}
{# estructura) para que cada template hijo solo sobreescriba {% block content %}. #}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SST Magnus - Catálogo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; color: #222; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem 0.75rem; text-align: left; }
        th { background: #f2f2f2; }
        .btn-nuevo { display: inline-block; margin-bottom: 1rem; padding: 0.5rem 1rem;
                     background: #2563eb; color: #fff; text-decoration: none; border-radius: 4px; }
        .btn-peligro { background: #dc2626; color: #fff; border: none; padding: 0.5rem 1rem;
                       border-radius: 4px; cursor: pointer; }
        .mensajes { list-style: none; padding: 0; }
        .mensajes li.success { color: #16a34a; }
        .mensajes li.error { color: #dc2626; }
        .campo-form { margin-bottom: 1rem; }
        .campo-form label { display: block; font-weight: bold; margin-bottom: 0.25rem; }
        .errores-campo { color: #dc2626; font-size: 0.85rem; margin: 0.25rem 0 0; }
        .paginacion { margin-top: 1rem; display: flex; gap: 1rem; align-items: center; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
